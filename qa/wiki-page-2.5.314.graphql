# Pinned Wiki.js v2.5.314 page schema subset (Query.pages only).
# Derived from the official pinned sources (see header):
#   https://github.com/requarks/wiki/v2.5.314/blob/main/server/graph/schemas/page.graphql
#   https://github.com/requarks/wiki/v2.5.314/blob/main/server/graph/resolvers/page.js
# Captures exactly what the connector depends on: the PageOrderBy enum (never
# String), the PageOrderByDirection enum, list item vs single shapes, and the
# object form of single.tags ([PageTag] with .tag) vs list.tags ([String]).
# No mutations are modeled: the connector emits read-only operations only.

enum PageOrderBy {
  ID
  PATH
  TITLE
  UPDATED
  CREATED
}

enum PageOrderByDirection {
  ASC
  DESC
}

type PageListItem {
  id: Int!
  path: String
  locale: String
  title: String
  description: String
  contentType: String
  tags: [String]
  updatedAt: String
}

type PageTag {
  id: Int
  tag: String
  title: String
}

type Page {
  id: Int!
  path: String!
  locale: String
  title: String
  content: String
  contentType: String
  updatedAt: String
  tags: [PageTag]
}

type PageQuery {
  list(
    limit: Int
    orderBy: PageOrderBy
    orderByDirection: PageOrderByDirection
    tags: [String!]
    locale: String
  ): [PageListItem]
  single(id: Int!): Page
}

type Query {
  pages: PageQuery
}
